<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小贺的个人介绍</title>
    <style>
        h1, .c {
            color: red;
        }

        body {
            max-width: 500px;
            margin: 0 auto;
            padding: 10px;
            background-color: white;
            font-family: "微软雅黑", Arial, sans-serif;
            font-size: 16px;
            line-height: 1.6;
            text-align: left;
        }

        th {
            background-color: #3678db;
            color: white;
            padding: 12px;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        a {
            color: #e74c3c;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .d {
            color: green;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        td {
            padding: 8px;
            text-align: center;
        }

        /* 重点：美化表单元素边框 */
        input, textarea {
            width: 100%;
            padding: 8px 10px; /* 调整内边距，让输入更舒适 */
            box-sizing: border-box;
            margin-top: 4px;
            /* 基础边框样式：圆角+浅灰色边框 */
            border: 1px solid #ddd;
            border-radius: 6px; /* 圆角，更柔和 */
            font-size: 15px; /* 统一字体大小 */
            outline: none; /* 去掉默认的聚焦外边框 */
            transition: border-color 0.3s ease; /* 边框变色过渡动画 */
        }

        /* 聚焦状态：边框变色，提升交互反馈 */
        input:focus, textarea:focus {
            border-color: #3678db; /* 与表头同色系，视觉统一 */
            box-shadow: 0 0 0 2px rgba(54, 120, 219, 0.1); /* 轻微发光效果 */
        }

        textarea {
            resize: vertical; /* 只允许垂直拉伸文本域 */
            min-height: 100px; /* 给文本域设置最小高度 */
        }

        button {
            padding: 8px 16px;
            background-color: #3678db;
            color: white;
            border: none;
            border-radius: 6px; /* 按钮也统一圆角 */
            cursor: pointer;
            font-size: 15px;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #286090;
        }
    </style>
</head>
<body>

</html>
